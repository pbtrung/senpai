image: alpine/latest
packages:
    - go
    - scdoc
sources:
    - https://github.com/pbtrung/senpai
artifacts:
    - senpai/senpai
tasks:
    - build: |
          cd senpai
          make
    - test: |
          cd senpai
          go test ./...
          go vet ./...
    - gofmt: |
          cd senpai
          test -z $(gofmt -l .)
